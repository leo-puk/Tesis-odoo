[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-migration-r2"
version = "0.4.0"
description = "Deterministic local migration evidence collection and retrieval for Odoo"
requires-python = ">=3.12,<3.13"
dependencies = ["networkx==3.7", "lxml==6.1.3", "pandas==2.3.3", "scikit-learn==1.7.2"]

[project.scripts]
r2 = "r2.cli:main"

[tool.setuptools.packages.find]
include = ["r2*"]
