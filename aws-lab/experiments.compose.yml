name: tesis-experiments
services:
  runner:
    build:
      context: ..
      dockerfile: aws-lab/Dockerfile
    entrypoint: [python, -u, /workspace/repo/aws-lab/experimentos.py]
    command: ["run", "--output", "/results/${R2_BATCH_ID:-lote30}", "--cache", "/data/batch-cache"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ../:/workspace/repo:ro
      - ./data:/data
      - ./results:/results
    environment:
      PYTHONUTF8: "1"
      PYTHONPATH: /workspace/repo/sandbox/r2
    init: true
    stop_grace_period: 30s
